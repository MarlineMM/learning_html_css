<!DOCTYPE html> <!-- Estructura básica de un documento HTML -->
<html lang="en"> <!-- Documento HTML -->
<head> <!-- Encabezado del documento HTML -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura HTML</title>
</head>
<body> <!-- Cuerpo del documento HTML -->
    <header> <!-- El elemento <header> se utiliza para definir el encabezado de una página o una sección. -->
        <h1>Mi Sitio Web</h1>
    </header>

    <h1>Hola Mundo</h1>

    
<!-- Estructura básica de un documento HTML -->

    <h1>Titulo Principal</h1>

    <h2>Subtitulo</h2>

    <h3>Marcar una seccion</h3>

    <h4>Marcar un ejemplo del apartado</h4>

    <h5>Marca un subapartado del ejemplo</h5>

    <h6>subapartado del ejemplo </h6>

    <article> <!-- La naturaleza del <article> dependerá del tipo de página: un artículo en un blog, una receta de cocina, una canción o video, un canal de Twitch, un widget personalizado en la página, etc... -->
        <h2>Articulo</h2>
        <p>Este es un articulo</p>
    </article>

    <div class="prueba">
        <nav> <!-- El elemento <nav> se utiliza para definir un bloque de navegación en una página web. Este bloque puede contener enlaces a otras páginas o secciones dentro del mismo sitio web, facilitando la navegación para los usuarios. -->
            <h2>Menu</h2>
            <a href="#">Inicio</a>
            <a href="#">Acerca de</a>
            <a href="#">Contacto</a>
        </nav>
    </div>

    <footer> <!-- El elemento <footer> se utiliza para definir el pie de página de un documento o sección. Suele contener información de contacto, derechos de autor, enlaces a políticas de privacidad, términos de servicio, etc. -->
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>




</body>
</html>
